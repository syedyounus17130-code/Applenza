<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Applenza Owner Dashboard</title><link rel="stylesheet" href="admin.css"></head><body><header><strong>APPLENZA <i>OWNER</i></strong><button onclick="logout()">Logout</button></header><main><div class="top"><div><small>PRIVATE OWNER DASHBOARD</small><h1>Service Requests</h1></div><button onclick="load()">Refresh</button></div><div id="stats" class="stats"></div><div class="box"><div class="head"><h2>Customer Leads</h2><span id="time"></span></div><div class="scroll"><table><thead><tr><th>Lead</th><th>Customer</th><th>Service</th><th>Location</th><th>Problem</th><th>Status</th><th>Received</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
const t=localStorage.getItem("applenza_admin_token");if(!t)location="admin-login.html";const H={Authorization:"Bearer "+t};
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function load(){const r=await fetch("/api/admin/leads",{headers:H});if(r.status===401){localStorage.removeItem("applenza_admin_token");return location="admin-login.html"}const a=await r.json(),s=["New","Contacted","Assigned","Completed","Cancelled"];stats.innerHTML=s.map(x=>`<div><b>${a.filter(l=>l.status===x).length}</b><span>${x}</span></div>`).join("");rows.innerHTML=a.length?a.map(l=>`<tr><td><b>${esc(l.id)}</b></td><td><b>${esc(l.name)}</b><br><a href="tel:${esc(l.phone)}">${esc(l.phone)}</a></td><td>${esc(l.service)}</td><td>${esc(l.area)}<br><small>${esc(l.address)}</small></td><td>${esc(l.problem||"—")}</td><td><select onchange="status('${esc(l.id)}',this.value)">${s.map(x=>`<option ${x===l.status?"selected":""}>${x}</option>`).join("")}</select></td><td>${new Date(l.createdAt).toLocaleString()}</td></tr>`).join(""):`<tr><td colspan="7" class="empty">No leads yet.</td></tr>`;time.textContent="Updated "+new Date().toLocaleTimeString()}
async function status(id,value){await fetch("/api/admin/leads/"+encodeURIComponent(id),{method:"PATCH",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({status:value})});load()}
async function logout(){await fetch("/api/admin/logout",{method:"POST",headers:H});localStorage.removeItem("applenza_admin_token");location="admin-login.html"}load();
</script></body></html>
