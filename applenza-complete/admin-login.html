<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Applenza Admin Login</title><link rel="stylesheet" href="admin.css"></head><body class="login"><div class="card"><div class="mark">A</div><small>PRIVATE OWNER ACCESS</small><h1>Applenza Admin</h1><p>Sign in to manage customer leads.</p><form id="f"><label>Username<input id="u" required autocomplete="username"></label><label>Password<input id="p" type="password" required autocomplete="current-password"></label><button>Sign in</button><b id="e"></b></form><a href="/">← Back to website</a></div><script>
f.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});const d=await r.json();if(!r.ok){document.getElementById("e").textContent=d.message;return}localStorage.setItem("applenza_admin_token",d.token);location="admin-dashboard.html"}
</script></body></html>
